name: Bootstrap gwz-libgit2-sys on crates.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-bootstrap
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Inspect bootstrap package
        run: cargo package --list --locked --manifest-path .github/bootstrap-crates/gwz-libgit2-sys/Cargo.toml
      - name: Verify bootstrap package
        run: cargo publish --dry-run --locked --manifest-path .github/bootstrap-crates/gwz-libgit2-sys/Cargo.toml
      - name: Publish bootstrap prerelease
        run: cargo publish --locked --manifest-path .github/bootstrap-crates/gwz-libgit2-sys/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
